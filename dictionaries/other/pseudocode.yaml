# Pseudocode dictionary for Clanker-Lang
language: pseudocode
name: Pseudocode
spec_version: "0.1"
dictionary_version: "1.0"
kind: other

opcodes:
  # Core (0x00-0x15)
  0x00:
    template: "DONE"
    with_param: "DONE with message \"{message}\""
  0x01:
    template: "WAIT for {duration}"
  0x02:
    template: "SET {name} <- {value}"
  0x03:
    template: "OUTPUT {value}"
  0x04:
    template: "LOG ({level}): {message}"
  0x05:
    template: "CALL {function}"
    with_param: "CALL {function} WITH {args}"
  0x06:
    template: "RETURN"
    with_param: "RETURN {value}"
  0x07:
    template: "LOAD {source}"
    with_param: "LOAD {source} AS {alias}"
  0x08:
    template: "STORE {key} <- {value}"
  0x09:
    template: "DELETE {key}"
  0x0A:
    template: "ASSERT {condition}"
    with_param: "ASSERT {condition} OR FAIL \"{message}\""
  0x0B:
    template: "DEFINE FUNCTION {name}"
    with_param: "DEFINE FUNCTION {name}({params})"
  0x0C:
    template: "LABEL {name}:"
  0x0D:
    template: "GOTO {label}"
  0x0E:
    template: "REGISTER OPCODE {opcode} AS {name}"
  0x0F:
    template: "END BLOCK"
  0x10:
    template: "NOTE: {text}"
  0x11:
    template: "YIELD"
    with_param: "YIELD {value}"
  0x12:
    template: "SPAWN TASK {function}"
    with_param: "SPAWN TASK {function} WITH {args}"
  0x13:
    template: "JOIN TASK {task}"
  0x14:
    template: "SEND \"{message}\" TO {target}"
  0x15:
    template: "RECEIVE FROM {channel}"

  # Hardware (0xA0-0xAB)
  0xA0:
    template: "SET GPIO PIN {pin} TO {state}"
  0xA1:
    template: "READ GPIO PIN {pin}"
  0xA2:
    template: "SET PWM ON PIN {pin} TO {duty}%"
  0xA3:
    template: "WRITE {data} TO I2C DEVICE {address} REGISTER {register}"
  0xA4:
    template: "READ {length} BYTES FROM I2C DEVICE {address} REGISTER {register}"
  0xA5:
    template: "SPI TRANSFER TO DEVICE {device}: {data}"
  0xA6:
    template: "SEND \"{data}\" OVER UART {port}"
  0xA7:
    template: "RECEIVE {length} BYTES FROM UART {port}"
  0xA8:
    template: "READ ADC CHANNEL {channel}"
  0xA9:
    template: "READ SENSOR {sensor}"
  0xAA:
    template: "SET MOTOR {motor} SPEED TO {speed}"
  0xAB:
    template: "WRITE \"{content}\" TO DISPLAY {display}"

  # Web (0xC0-0xCF)
  0xC0:
    template: "DEFINE {method} ENDPOINT AT {path}"
  0xC1:
    template: "RESPOND WITH STATUS {status}"
    with_param: "RESPOND WITH STATUS {status} AND BODY {body}"
  0xC2:
    template: "MAKE {method} REQUEST TO {url}"
    with_param: "MAKE {method} REQUEST TO {url} WITH BODY {body}"
  0xC3:
    template: "SET HEADER {name} = {value}"
  0xC4:
    template: "USE MIDDLEWARE {name}"
  0xC5:
    template: "OPEN WEBSOCKET AT {path}"
  0xC6:
    template: "REQUIRE {scheme} AUTHENTICATION"
  0xC7:
    template: "RATE LIMIT: {max_requests} REQUESTS PER {window}"
  0xC8:
    template: "ALLOW CORS FROM {origin}"
    with_param: "ALLOW CORS FROM {origin} METHODS {methods} HEADERS {headers}"
  0xC9:
    template: "SET COOKIE {name} = {value}"
    with_param: "SET COOKIE {name} = {value} MAX-AGE {max_age}"
  0xCA:
    template: "{action} SESSION"
    with_param: "{action} SESSION KEY {key}"
  0xCB:
    template: "CONFIGURE SSL CERT {cert} KEY {key}"
    with_param: "CONFIGURE SSL CERT {cert} KEY {key} MIN TLS {min_version}"
  0xCC:
    template: "GRAPHQL ENDPOINT AT {path}"
    with_param: "GRAPHQL ENDPOINT AT {path} SCHEMA {schema}"
  0xCD:
    template: "SSE STREAM AT {path}"
    with_param: "SSE STREAM AT {path} EVENT {event}"
  0xCE:
    template: "ACCEPT UPLOAD FIELD {field}"
    with_param: "ACCEPT UPLOAD FIELD {field} MAX SIZE {max_size}"
  0xCF:
    template: "REDIRECT TO {url}"
    with_param: "REDIRECT TO {url} WITH STATUS {status}"

  # Data (0xD0-0xDF)
  0xD0:
    template: "QUERY {source}"
    with_param: "QUERY {source} WHERE {filter}"
  0xD1:
    template: "TRANSFORM DATA: {operation}"
    with_param: "TRANSFORM FIELD {field}: {operation}"
  0xD2:
    template: "VALIDATE DATA AGAINST {schema}"
  0xD3:
    template: "FOR EACH ELEMENT, APPLY {function}"
  0xD4:
    template: "FILTER WHERE {predicate}"
  0xD5:
    template: "REDUCE USING {operation}"
    with_param: "REDUCE {field} USING {operation}"
  0xD6:
    template: "SORT BY {field}"
    with_param: "SORT BY {field} {order}"
  0xD7:
    template: "GROUP BY {field}"
  0xD8:
    template: "JOIN {left} WITH {right}"
    with_param: "JOIN {left} WITH {right} ON {on}"
  0xD9:
    template: "DISTINCT"
    with_param: "DISTINCT ON {field}"
  0xDA:
    template: "MERGE {source} INTO {target}"
    with_param: "MERGE {source} INTO {target} STRATEGY {strategy}"
  0xDB:
    template: "DEFINE SCHEMA {name}"
    with_param: "DEFINE SCHEMA {name} WITH FIELDS {fields}"
  0xDC:
    template: "CREATE INDEX ON {field}"
  0xDD:
    template: "BATCH SIZE {size}"
  0xDE:
    template: "STREAM FROM {source}"
    with_param: "STREAM FROM {source} HANDLE WITH {handler}"
  0xDF:
    template: "CACHE KEY {key}"
    with_param: "CACHE KEY {key} TTL {ttl}"

  # Logic (0xE0-0xE3)
  0xE0:
    template: "IF {condition} THEN"
  0xE1:
    template: "MATCH {value} AGAINST"
  0xE2:
    template: "REPEAT {count} TIMES"
    with_param: "WHILE {condition} DO"
  0xE3:
    template: "TRY"

# Emotional region mappings for pseudocode output
# Maps emotions to annotation comments
emotional_regions:
  positive: "// SENTIMENT: POSITIVE ({valence})"
  negative: "// SENTIMENT: NEGATIVE ({valence})"
  neutral: "// SENTIMENT: NEUTRAL"
