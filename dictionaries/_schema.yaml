# Dictionary Schema
# All dictionary files must conform to this schema.

schema:
  required_fields:
    - language       # ISO 639-1 code (e.g., "en", "zh") or language name (e.g., "python")
    - name           # Human-readable name (e.g., "English", "Python")
    - spec_version   # Clanker spec version this dictionary targets
    - dictionary_version  # Version of this dictionary
    - kind           # "human", "code", or "other"
    - opcodes        # Map of opcode hex strings to translation entries

  opcode_entry:
    human:
      required:
        - template     # Default rendering with {param} placeholders
      optional:
        - with_param   # Alternate rendering when an optional param is present
        - block_open   # Rendering when this opcode opens a block
        - block_close  # Rendering for the closing END of this block
        - description  # Localized description of the opcode

    code:
      required:
        - template     # Code snippet with {param} placeholders
      optional:
        - imports      # Required imports or use statements
        - block_open   # Code for opening a block scope
        - block_close  # Code for closing a block scope
        - context      # Additional context (e.g., "inside async fn")

    other:
      required:
        - template
      optional:
        - with_param
        - description

  placeholders:
    description: >
      Placeholders in templates use {param_name} syntax matching the
      parameter names defined in the opcode YAML files. For example,
      if an opcode has a param named "method", the template can use
      {method} to insert the value.

  example:
    language: en
    name: English
    spec_version: "0.1"
    dictionary_version: "1.0"
    kind: human
    opcodes:
      0x00:
        template: "done"
        with_param: "done: \"{message}\""
