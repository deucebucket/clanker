# Python code dictionary for Clanker-Lang
language: python
name: Python
spec_version: "0.1"
dictionary_version: "1.0"
kind: code

opcodes:
  # Core (0x00-0x1F)
  0x00:
    template: "pass"
    with_param: "print(\"{message}\")"
  0x01:
    template: "time.sleep({duration})"
    imports: ["import time"]
  0x02:
    template: "{name} = {value}"
  0x03:
    template: "print({value})"
  0x04:
    template: "logging.{level}(\"{message}\")"
    imports: ["import logging"]
  0x05:
    template: "{function}()"
    with_param: "{function}({args})"
  0x06:
    template: "return"
    with_param: "return {value}"
  0x07:
    template: "import {source}"
    with_param: "import {source} as {alias}"
  0x08:
    template: "store[{key}] = {value}"
  0x09:
    template: "del store[{key}]"
  0x0A:
    template: "assert {condition}"
    with_param: "assert {condition}, \"{message}\""
  0x0B:
    template: "def {name}():"
    with_param: "def {name}({params}):"
  0x0C:
    template: "# label: {name}"
  0x0D:
    template: "# goto {label}  (not supported in Python)"
  0x0E:
    template: "opcodes[{opcode}] = {name}"
  0x0F:
    template: ""
    block_close: "# end block"
  0x10:
    template: "# {text}"
  0x11:
    template: "yield"
    with_param: "yield {value}"
  0x12:
    template: "asyncio.create_task({function}())"
    with_param: "asyncio.create_task({function}({args}))"
    imports: ["import asyncio"]
  0x13:
    template: "await {task}"
  0x14:
    template: "await {target}.send(\"{message}\")"
  0x15:
    template: "msg = await {channel}.receive()"
    with_param: "msg = await asyncio.wait_for({channel}.receive(), timeout={timeout})"
  0x16:
    template: "dst = src"
  0x17:
    template: "sys.exit({code})"
    with_param: "sys.exit({code})  # {message}"
    imports: ["import sys"]
  0x18:
    template: "target, source = source, target"
  0x19:
    template: "stack.append({value})"
  0x1A:
    template: "target = stack.pop()"
  0x1B:
    template: "target = {to_type}(target)"
  0x1C:
    template: "event_bus.emit(\"{name}\")"
    with_param: "event_bus.emit(\"{name}\", {data})"
  0x1D:
    template: "event_bus.on(\"{event}\", {handler})"
  0x1E:
    template: "variables.clear()"
    with_param: "clear_scope(\"{scope}\")"
  0x1F:
    template: "# clanker spec version: {spec}"

  # Reasoning (0x20-0x26)
  0x20:
    template: "# Consider: {premise}"
  0x21:
    template: "assert {condition}  # -> {result}"
  0x22:
    template: "if {if_condition}:  # then {then_conclusion}"
  0x23:
    template: "# Therefore: {conclusion}"
  0x24:
    template: "return {result}  # certainty: {cert}"
  0x25:
    template: "# DOUBT: step {step_ref} - {reason}"
  0x26:
    template: "# ASSUME: {assumption}"

  # Hardware (0xA0-0xAB)
  0xA0:
    template: "GPIO.output({pin}, GPIO.{'HIGH' if {state} else 'LOW'})"
    imports: ["import RPi.GPIO as GPIO"]
  0xA1:
    template: "GPIO.input({pin})"
    imports: ["import RPi.GPIO as GPIO"]
  0xA2:
    template: "pwm_{pin}.ChangeDutyCycle({duty})"
  0xA3:
    template: "bus.write_byte_data({address}, {register}, {data})"
    imports: ["import smbus2"]
  0xA4:
    template: "bus.read_i2c_block_data({address}, {register}, {length})"
    imports: ["import smbus2"]
  0xA5:
    template: "spi.xfer2({data})"
    imports: ["import spidev"]
  0xA6:
    template: "serial.Serial({port}, {baud}).write({data}.encode())"
    imports: ["import serial"]
  0xA7:
    template: "serial.Serial({port}).read({length})"
    imports: ["import serial"]
  0xA8:
    template: "adc.read({channel})"
  0xA9:
    template: "sensor.read({sensor})"
  0xAA:
    template: "motor_{motor}.set_speed({speed})"
  0xAB:
    template: "display_{display}.write(\"{content}\")"

  # Web (0xC0-0xCF)
  0xC0:
    template: "@app.route(\"{path}\", methods=[\"{method}\"])\ndef handle_{path}():"
    imports: ["from flask import Flask, request, jsonify"]
  0xC1:
    template: "return \"\", {status}"
    with_param: "return {body}, {status}"
  0xC2:
    template: "requests.{method}(\"{url}\")"
    with_param: "requests.{method}(\"{url}\", json={body})"
    imports: ["import requests"]
  0xC3:
    template: "headers[\"{name}\"] = \"{value}\""
  0xC4:
    template: "@app.before_request\ndef {name}():"
  0xC5:
    template: "@socketio.on(\"connect\", namespace=\"{path}\")"
    imports: ["from flask_socketio import SocketIO"]
  0xC6:
    template: "@login_required"
    with_param: "@roles_required(\"{role}\")"
  0xC7:
    template: "@limiter.limit(\"{max_requests} per {window}\")"
    imports: ["from flask_limiter import Limiter"]
  0xC8:
    template: "CORS(app, origins=[\"{origin}\"])"
    with_param: "CORS(app, origins=[\"{origin}\"], methods=[{methods}], allow_headers=[{headers}])"
    imports: ["from flask_cors import CORS"]
  0xC9:
    template: "resp.set_cookie(\"{name}\", \"{value}\")"
    with_param: "resp.set_cookie(\"{name}\", \"{value}\", max_age={max_age})"
  0xCA:
    template: "session.{action}()"
    with_param: "session[\"{key}\"]"
  0xCB:
    template: "ssl_context = (\"{cert}\", \"{key}\")"
    with_param: "ssl_context = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)\nssl_context.minimum_version = ssl.TLSVersion.{min_version}\nssl_context.load_cert_chain(\"{cert}\", \"{key}\")"
    imports: ["import ssl"]
  0xCC:
    template: "app.add_url_rule(\"{path}\", view_func=GraphQLView.as_view(\"graphql\"))"
    with_param: "app.add_url_rule(\"{path}\", view_func=GraphQLView.as_view(\"graphql\", schema={schema}))"
    imports: ["from graphql_server.flask import GraphQLView"]
  0xCD:
    template: "@app.route(\"{path}\")\ndef sse_stream():\n    return Response(event_stream(), mimetype=\"text/event-stream\")"
    with_param: "@app.route(\"{path}\")\ndef sse_stream():\n    return Response(event_stream(\"{event}\"), mimetype=\"text/event-stream\")"
  0xCE:
    template: "file = request.files[\"{field}\"]"
    with_param: "file = request.files[\"{field}\"]  # max: {max_size}"
  0xCF:
    template: "return redirect(\"{url}\")"
    with_param: "return redirect(\"{url}\", code={status})"
    imports: ["from flask import redirect"]

  # Data (0xD0-0xDF)
  0xD0:
    template: "db.query(\"{source}\")"
    with_param: "db.query(\"{source}\").filter({filter})"
  0xD1:
    template: "data = {operation}(data)"
    with_param: "data[\"{field}\"] = {operation}(data[\"{field}\"])"
  0xD2:
    template: "validate(data, schema=\"{schema}\")"
  0xD3:
    template: "result = list(map({function}, collection))"
  0xD4:
    template: "result = list(filter(lambda x: {predicate}, collection))"
  0xD5:
    template: "result = functools.reduce({operation}, collection)"
    with_param: "result = functools.reduce({operation}, (x[\"{field}\"] for x in collection))"
    imports: ["import functools"]
  0xD6:
    template: "collection.sort(key=lambda x: x[\"{field}\"])"
    with_param: "collection.sort(key=lambda x: x[\"{field}\"], reverse={order} == \"desc\")"
  0xD7:
    template: "groups = itertools.groupby(collection, key=lambda x: x[\"{field}\"])"
    imports: ["import itertools"]
  0xD8:
    template: "result = [{**a, **b} for a in {left} for b in {right}]"
    with_param: "result = [{**a, **b} for a in {left} for b in {right} if a[\"{on}\"] == b[\"{on}\"]]"
  0xD9:
    template: "result = list({{id(x): x for x in collection}}.values())"
    with_param: "result = list({{x[\"{field}\"]: x for x in collection}}.values())"
  0xDA:
    template: "{target}.update({source})"
    with_param: "{target}.update({source})  # strategy: {strategy}"
  0xDB:
    template: "schema[\"{name}\"] = {{}}"
    with_param: "schema[\"{name}\"] = {fields}"
  0xDC:
    template: "index[\"{field}\"] = {{x[\"{field}\"]: x for x in collection}}"
  0xDD:
    template: "for batch in [collection[i:i+{size}] for i in range(0, len(collection), {size})]:"
  0xDE:
    template: "for item in iter_stream(\"{source}\"):"
    with_param: "for item in iter_stream(\"{source}\", handler={handler}):"
  0xDF:
    template: "@functools.cache\ndef get_{key}():"
    with_param: "@functools.lru_cache(maxsize=None)  # ttl: {ttl}\ndef get_{key}():"
    imports: ["import functools"]

  # Logic (0xE0-0xED)
  0xE0:
    template: "if {condition}:"
  0xE1:
    template: "match {value}:"
  0xE2:
    template: "for _ in range({count}):"
    with_param: "while {condition}:"
  0xE3:
    template: "try:"
    block_close: "except Exception as e:"
  0xE4:
    template: "else:"
    with_param: "elif {condition}:"
  0xE5:
    template: "break"
  0xE6:
    template: "continue"
  0xE7:
    template: "except {error_type}:"
    with_param: "except {error_type} as {target}:"
  0xE8:
    template: "finally:"
  0xE9:
    template: "raise {error_type}()"
    with_param: "raise {error_type}({message})"
  0xEA:
    template: "match {value}:"
  0xEB:
    template: "for {element_var} in {collection}:"
  0xEC:
    template: "while {condition}:"
  0xED:
    template: "assert isinstance({variable}, {expected_type})"
    with_param: "assert isinstance({variable}, {expected_type}), \"{message}\""

# Emotional region mappings for code output
# Code dictionaries map emotions to comment annotations
emotional_regions:
  positive: "# sentiment: positive ({valence})"
  negative: "# sentiment: negative ({valence})"
  neutral: "# sentiment: neutral"
