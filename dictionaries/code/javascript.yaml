  0x02:
    template: "let {name} = {value};"
  0x03:
    template: "console.log({value});"
  0x04:
    template: "console.{level}(\"{message}\");"
  0x05:
    template: "{function}();"
    with_param: "{function}({args});"
  0x06:
    template: "return;"
    with_param: "return {value};"
  0x07:
    template: "const {alias} = require(\"{source}\");"
    imports: []
  0x08:
    template: "store[\"{key}\"] = {value};"
  0x09:
    template: "delete store[\"{key}\"];"
  0x0A:
    template: "console.assert({condition});"
    with_param: "console.assert({condition}, \"{message}\");"
  0x0B:
