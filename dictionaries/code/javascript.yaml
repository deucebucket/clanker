  0x0F:
    template: "}}"
  0x10:
    template: "// {text}"
  0x11:
    template: "yield;"
    with_param: "yield {value};"
  0x12:
    template: "{function}();"
    with_param: "{function}({args});"
  0x13:
    template: "await {task};"
  0x14:
    template: "{target}.send(\"{message}\");"
