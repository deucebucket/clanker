  0xAA:
    template: "motor[{motor}].setSpeed({speed});"
  0xAB:
    template: "display['{display}'].write(\"{content}\");"

  # Web (0xC0-0xCF)
  0xC0:
    template: "app.{method}(\"{path}\", async (req, res) => {{"
    imports: ["const express = require('express');", "const app = express();"]
  0xC1:
    template: "res.status({status}).end();"
