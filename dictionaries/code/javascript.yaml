# JavaScript code dictionary for Clanker-Lang
language: javascript
name: JavaScript
spec_version: "0.1"
dictionary_version: "1.0"
kind: code

opcodes:
  # Core (0x00-0x15)
  0x00:
    template: "// done"
    with_param: "console.log(\"{message}\");"
  0x01:
