    with_param: "await fetch(\"{url}\", {{ method: \"{method}\", body: JSON.stringify({body}) }});"
  0xC3:
    template: "res.setHeader(\"{name}\", \"{value}\");"
  0xC4:
    template: "app.use({name});"
  0xC5:
    template: "io.on(\"connection\", (socket) => {{ // {path}"
    imports: ["const io = require('socket.io')(server);"]
  0xC6:
    template: "// auth: {scheme}"
    with_param: "// auth: {scheme}, role: {role}"
  0xC7:
    template: "// rate limit: {max_requests} per {window}"
  0xC8:
    template: "app.use(cors({{ origin: \"{origin}\" }}));"
    with_param: "app.use(cors({{ origin: \"{origin}\", methods: [{methods}], allowedHeaders: [{headers}] }}));"
    imports: ["const cors = require('cors');"]
  0xC9:
    template: "res.cookie(\"{name}\", \"{value}\");"
    with_param: "res.cookie(\"{name}\", \"{value}\", {{ maxAge: {max_age} }});"
  0xCA:
    template: "req.session.{action}();"
    with_param: "req.session.{key};"
  0xCB:
    template: "const server = https.createServer({{ cert: fs.readFileSync(\"{cert}\"), key: fs.readFileSync(\"{key}\") }}, app);"
    with_param: "const server = https.createServer({{ cert: fs.readFileSync(\"{cert}\"), key: fs.readFileSync(\"{key}\"), minVersion: \"{min_version}\" }}, app);"
    imports: ["const https = require('https');", "const fs = require('fs');"]
  0xCC:
    template: "app.use(\"{path}\", graphqlHTTP({{ graphiql: true }}));"
    with_param: "app.use(\"{path}\", graphqlHTTP({{ schema: {schema}, graphiql: true }}));"
    imports: ["const {{ graphqlHTTP }} = require('express-graphql');"]
  0xCD:
    template: "app.get(\"{path}\", (req, res) => {{ res.setHeader(\"Content-Type\", \"text/event-stream\"); }});"
    with_param: "app.get(\"{path}\", (req, res) => {{ res.setHeader(\"Content-Type\", \"text/event-stream\"); res.write(\"event: {event}\\n\"); }});"
  0xCE:
    template: "const file = req.files.{field};"
    with_param: "const file = req.files.{field};  // max: {max_size}"
    imports: ["const multer = require('multer');"]
  0xCF:
    template: "res.redirect(\"{url}\");"
    with_param: "res.redirect({status}, \"{url}\");"

  # Data (0xD0-0xDF)
  0xD0:
    template: "const results = await db.query(\"{source}\");"
    with_param: "const results = await db.query(\"{source}\").where({filter});"
  0xD1:
