  0xD8:
    template: "const result = {left}.flatMap(a => {right}.map(b => ({{...a, ...b}})));"
    with_param: "const result = {left}.flatMap(a => {right}.filter(b => a.{on} === b.{on}).map(b => ({{...a, ...b}})));"
  0xD9:
    template: "const result = [...new Set(collection)];"
    with_param: "const result = [...new Map(collection.map(x => [x.{field}, x])).values()];"
  0xDA:
    template: "Object.assign({target}, {source});"
    with_param: "Object.assign({target}, {source});  // strategy: {strategy}"
  0xDB:
    template: "const {name}Schema = {{}};"
    with_param: "const {name}Schema = {{ {fields} }};"
  0xDC:
    template: "const index = new Map(collection.map(x => [x.{field}, x]));"
  0xDD:
    template: "for (let i = 0; i < collection.length; i += {size}) {{ const batch = collection.slice(i, i + {size});"
  0xDE:
    template: "for await (const item of stream(\"{source}\")) {{"
    with_param: "for await (const item of stream(\"{source}\").pipe({handler})) {{"
  0xDF:
    template: "const cached = cache.get(\"{key}\") ?? cache.set(\"{key}\", compute());"
    with_param: "const cached = cache.get(\"{key}\", {{ ttl: {ttl} }}) ?? cache.set(\"{key}\", compute(), {{ ttl: {ttl} }});"

  # Logic (0xE0-0xE3)
  0xE0:
    template: "if ({condition}) {{"
  0xE1:
    template: "switch ({value}) {{"
  0xE2:
    template: "for (let i = 0; i < {count}; i++) {{"
    with_param: "while ({condition}) {{"
  0xE3:
    template: "try {{"
    block_close: "}} catch (e) {{"

