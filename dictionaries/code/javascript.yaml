    imports: ["const i2c = require('i2c-bus');"]
  0xA4:
    template: "const buf = Buffer.alloc({length}); i2c.readI2cBlockSync({address}, {register}, {length}, buf);"
    imports: ["const i2c = require('i2c-bus');"]
  0xA5:
