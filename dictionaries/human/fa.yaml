# Farsi (Persian) dictionary for Clanker-Lang
language: fa
name: "فارسی"
spec_version: "0.1"
dictionary_version: "1.0"
kind: human

opcodes:
  # Core (0x00-0x15)
  0x00:
    template: "تمام"
    with_param: "تمام: «{message}»"
  0x01:
    template: "صبر کن {duration}"
  0x02:
    template: "{name} را برابر {value} قرار بده"
  0x03:
    template: "ارسال {value}"
  0x04:
    template: "ثبت [{level}] {message}"
  0x05:
    template: "فراخوانی {function}"
    with_param: "فراخوانی {function} با {args}"
  0x06:
    template: "بازگشت"
    with_param: "بازگشت {value}"
  0x07:
    template: "بارگذاری {source}"
    with_param: "بارگذاری {source} با نام {alias}"
  0x08:
    template: "ذخیره {key} = {value}"
  0x09:
    template: "حذف {key}"
  0x0A:
    template: "تأیید {condition}"
    with_param: "تأیید {condition}: «{message}»"
  0x0B:
    template: "تعریف {name}"
    with_param: "تعریف {name}({params})"
  0x0C:
    template: "برچسب {name}"
  0x0D:
    template: "پرش به {label}"
  0x0E:
    template: "ثبت کد عملیات {opcode} با نام {name}"
  0x0F:
    template: "پایان"
  0x10:
    template: "# {text}"
  0x11:
    template: "واگذاری"
    with_param: "واگذاری {value}"
  0x12:
    template: "ایجاد {function}"
    with_param: "ایجاد {function} با {args}"
  0x13:
    template: "اتصال به {task}"
  0x14:
    template: "ارسال {message} به {target}"
  0x15:
    template: "دریافت از {channel}"
    with_param: "دریافت از {channel} (مهلت {timeout})"

  # Reasoning (0x20-0x26)
  0x20:
    template: "در نظر بگیر: {premise}"
    with_param: "در نظر بگیر: {premise} (اطمینان: {cert})"
  0x21:
    template: "بررسی: {condition} -> {result}"
  0x22:
    template: "اگر {if_condition} آنگاه {then_conclusion}"
  0x23:
    template: "بنابراین: {conclusion} (از مراحل {from_steps})"
  0x24:
    template: "پاسخ: {result}"
    with_param: "پاسخ: {result} (اطمینان: {cert})"
  0x25:
    template: "تردید در مرحله {step_ref}: {reason}"
  0x26:
    template: "با فرض: {assumption}"

  # Hardware (0xA0-0xAB)
  0xA0:
    template: "تنظیم پایه GPIO {pin} روی {state}"
  0xA1:
    template: "خواندن پایه GPIO {pin}"
  0xA2:
    template: "تنظیم PWM روی پایه {pin} به {duty}٪"
    with_param: "تنظیم PWM روی پایه {pin} به {duty}٪ با فرکانس {frequency} هرتز"
  0xA3:
    template: "نوشتن {data} به دستگاه I2C با آدرس {address} ثبات {register}"
  0xA4:
    template: "خواندن {length} بایت از دستگاه I2C با آدرس {address} ثبات {register}"
  0xA5:
    template: "انتقال SPI به دستگاه {device}: {data}"
  0xA6:
    template: "ارسال «{data}» از طریق UART {port}"
  0xA7:
    template: "دریافت {length} بایت از UART {port}"
  0xA8:
    template: "خواندن کانال ADC {channel}"
  0xA9:
    template: "خواندن حسگر {sensor}"
    with_param: "خواندن حسگر {sensor} با واحد {unit}"
  0xAA:
    template: "تنظیم سرعت موتور {motor} به {speed}"
    with_param: "تنظیم سرعت موتور {motor} به {speed} جهت {direction}"
  0xAB:
    template: "نوشتن «{content}» روی نمایشگر {display}"

  # Web (0xC0-0xC7)
  0xC0:
    template: "تعریف نقطه پایانی {method} در مسیر {path}"
  0xC1:
    template: "پاسخ با وضعیت {status}"
    with_param: "پاسخ با وضعیت {status}: {body}"
  0xC2:
    template: "درخواست {method} به {url}"
    with_param: "درخواست {method} به {url} با بدنه {body}"
  0xC3:
    template: "تنظیم سرآیند {name}: {value}"
  0xC4:
    template: "استفاده از میان‌افزار {name}"
    with_param: "استفاده از میان‌افزار {name} در مرحله {phase}"
  0xC5:
    template: "وب‌سوکت در مسیر {path}"
    with_param: "وب‌سوکت در مسیر {path} هنگام {event}"
  0xC6:
    template: "نیاز به احراز هویت {scheme}"
    with_param: "نیاز به احراز هویت {scheme} با نقش {role}"
  0xC7:
    template: "محدودیت نرخ: {max_requests} درخواست در هر {window}"

  # Data (0xD0-0xD4)
  0xD0:
    template: "پرس‌وجو از {source}"
    with_param: "پرس‌وجو از {source} با شرط {filter}"
  0xD1:
    template: "تبدیل: {operation}"
    with_param: "تبدیل {field}: {operation}"
  0xD2:
    template: "اعتبارسنجی بر اساس {schema}"
  0xD3:
    template: "اعمال {function} روی مجموعه"
  0xD4:
    template: "فیلتر با شرط {predicate}"

  # Logic (0xE0-0xED)
  0xE0:
    template: "هنگامی که {condition}:"
  0xE1:
    template: "تطبیق {value}:"
  0xE2:
    template: "تکرار {count} بار:"
    with_param: "تکرار تا زمانی که {condition}:"
  0xE3:
    template: "تلاش کن:"
    with_param: "تلاش کن (خطا در {error_var}):"
  0xE4:
    template: "در غیر این صورت:"
    with_param: "در غیر این صورت، اگر {condition}:"
  0xE5:
    template: "توقف تکرار"
  0xE6:
    template: "رد شو به بعدی"
  0xE7:
    template: "اگر خطای {error_type} رخ دهد:"
    with_param: "اگر خطای {error_type} رخ دهد (در {target}):"
  0xE8:
    template: "همیشه انجام بده:"
  0xE9:
    template: "اعلام خطا: {error_type}"
    with_param: "اعلام خطا: {error_type} — {message}"
  0xEA:
    template: "بر اساس {value} تصمیم بگیر:"
  0xEB:
    template: "برای هر {element_var} در {collection}:"
  0xEC:
    template: "تا زمانی که {condition}:"
  0xED:
    template: "تأیید نوع {variable} برابر {expected_type}"
    with_param: "تأیید نوع {variable} برابر {expected_type}: «{message}»"

# Emotional Vector Region Mappings
emotional_regions:
  joy:
    valence: [64, 127]
    arousal: [0, 80]
    dominance: [20, 100]
    description: "راضی، شاد، خشنود"
  excitement:
    valence: [60, 127]
    arousal: [80, 127]
    dominance: [40, 127]
    description: "هیجان‌زده، پرانرژی، سرمست"
  anger:
    valence: [-127, -40]
    arousal: [60, 127]
    dominance: [40, 127]
    description: "ناامید، عصبانی، خشمگین"
  fear:
    valence: [-127, -20]
    arousal: [60, 127]
    dominance: [-127, -20]
    description: "مضطرب، ترسیده، وحشت‌زده"
  sadness:
    valence: [-127, -30]
    arousal: [-127, -20]
    dominance: [-127, 0]
    description: "غمگین، اندوهناک، سوگوار"
  calm:
    valence: [-10, 40]
    arousal: [-127, -40]
    dominance: [-20, 40]
    description: "آرام، مسالمت‌آمیز، آسوده"
  surprise:
    valence: [-20, 80]
    arousal: [80, 127]
    dominance: [-40, 40]
    description: "جا خورده، شگفت‌زده، حیرت‌زده"
  disgust:
    valence: [-127, -50]
    arousal: [0, 60]
    dominance: [20, 80]
    description: "متنفر، بیزار، تحقیرآمیز"
  trust:
    valence: [30, 100]
    arousal: [-40, 40]
    dominance: [0, 60]
    description: "مطمئن، امن، باایمان"
  neutral:
    valence: [-15, 15]
    arousal: [-15, 15]
    dominance: [-15, 15]
    description: "بدون بار احساسی خاص"
  urgency_low:
    urgency: [0, 50]
    description: "معمولی، بدون فشار زمانی"
  urgency_medium:
    urgency: [51, 150]
    description: "اولویت متوسط، نیاز به توجه به‌موقع"
  urgency_high:
    urgency: [151, 220]
    description: "اولویت بالا، نیاز به اقدام فوری"
  urgency_critical:
    urgency: [221, 255]
    description: "بحرانی، نیاز به اقدام آنی"

emotional_coordinates:
  "+0.9,+0.9": "سرمست"
  "+0.8,+0.7": "هیجان‌زده"
  "+0.7,+0.5": "شوق‌زده"
  "+0.6,+0.3": "شاد"
  "+0.4,+0.1": "خشنود"
  "+0.3,-0.2": "راضی"
  "+0.2,-0.5": "آرام"
  "+0.1,-0.7": "آسوده"
  "0.0,0.0": "خنثی"
  "-0.2,-0.3": "دلتنگ"
  "-0.3,-0.1": "ناامید"
  "-0.4,+0.2": "سرخورده"
  "-0.5,+0.4": "آزرده"
  "-0.6,+0.6": "عصبانی"
  "-0.8,+0.8": "خشمگین"
  "-0.9,+0.9": "از کوره دررفته"
  "-0.3,+0.7": "مضطرب"
  "-0.5,+0.8": "وحشت‌زده"
  "-0.6,-0.4": "غمگین"
  "-0.8,-0.6": "مأیوس"
  "-0.1,+0.9": "جا خورده"
  "+0.1,+0.8": "حیرت‌زده"

intent_mappings:
  request: "آیا می‌توانید {action}؟"
  inform: "{content}"
  question: "{content}؟"
  command: "{action}!"
  empathize: "درک می‌کنم، {content}"
  greet: "سلام"
  farewell: "خداحافظ"
  agree: "بله، {content}"
  disagree: "نه، {content}"
  apologize: "متأسفم، {content}"
