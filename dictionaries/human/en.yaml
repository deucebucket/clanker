# English dictionary for Clanker-Lang
language: en
name: English
spec_version: "0.1"
dictionary_version: "1.0"
kind: human

opcodes:
  # Core (0x00-0x1F)
  0x00:
    template: "done"
    with_param: "done: \"{message}\""
  0x01:
    template: "wait {duration}"
  0x02:
    template: "set {name} to {value}"
  0x03:
    template: "emit {value}"
  0x04:
    template: "log [{level}] {message}"
  0x05:
    template: "call {function}"
    with_param: "call {function} with {args}"
  0x06:
    template: "return"
    with_param: "return {value}"
  0x07:
    template: "load {source}"
    with_param: "load {source} as {alias}"
  0x08:
    template: "store {key} = {value}"
  0x09:
    template: "delete {key}"
  0x0A:
    template: "assert {condition}"
    with_param: "assert {condition}: \"{message}\""
  0x0B:
    template: "define {name}"
    with_param: "define {name}({params})"
  0x0C:
    template: "label {name}"
  0x0D:
    template: "goto {label}"
  0x0E:
    template: "register opcode {opcode} as {name}"
  0x0F:
    template: "end"
  0x10:
    template: "# {text}"
  0x11:
    template: "yield"
    with_param: "yield {value}"
  0x12:
    template: "spawn {function}"
    with_param: "spawn {function} with {args}"
  0x13:
    template: "join {task}"
  0x14:
    template: "send {message} to {target}"
  0x15:
    template: "receive from {channel}"
    with_param: "receive from {channel} (timeout {timeout})"
  0x16:
    template: "copy $src to $dst"
  0x17:
    template: "halt with code {code}"
    with_param: "halt with code {code}: \"{message}\""
  0x18:
    template: "swap $target and $source"
  0x19:
    template: "push {value}"
  0x1A:
    template: "pop into $target"
  0x1B:
    template: "cast $target to {to_type}"
  0x1C:
    template: "emit event {name}"
    with_param: "emit event {name} with {data}"
  0x1D:
    template: "on event {event} call {handler}"
  0x1E:
    template: "clear all variables"
    with_param: "clear variables in {scope}"
  0x1F:
    template: "version {spec}"

  # Reasoning (0x20-0x26)
  0x20:
    template: "consider: {premise}"
    with_param: "consider: {premise} (certainty: {cert})"
  0x21:
    template: "check: {condition} -> {result}"
  0x22:
    template: "if {if_condition} then {then_conclusion}"
  0x23:
    template: "therefore: {conclusion} (from steps {from_steps})"
  0x24:
    template: "answer: {result}"
    with_param: "answer: {result} (certainty: {cert})"
  0x25:
    template: "doubt step {step_ref}: {reason}"
  0x26:
    template: "assuming: {assumption}"

  # Hardware (0xA0-0xAB)
  0xA0:
    template: "set GPIO pin {pin} to {state}"
  0xA1:
    template: "read GPIO pin {pin}"
  0xA2:
    template: "set PWM on pin {pin} to {duty}%"
    with_param: "set PWM on pin {pin} to {duty}% at {frequency}Hz"
  0xA3:
    template: "write {data} to I2C device {address} register {register}"
  0xA4:
    template: "read {length} bytes from I2C device {address} register {register}"
  0xA5:
    template: "SPI transfer to device {device}: {data}"
  0xA6:
    template: "send \"{data}\" over UART {port}"
  0xA7:
    template: "receive {length} bytes from UART {port}"
  0xA8:
    template: "read ADC channel {channel}"
  0xA9:
    template: "read sensor {sensor}"
    with_param: "read sensor {sensor} in {unit}"
  0xAA:
    template: "set motor {motor} speed to {speed}"
    with_param: "set motor {motor} speed to {speed} direction {direction}"
  0xAB:
    template: "write \"{content}\" to display {display}"

  # Web (0xC0-0xCF)
  0xC0:
    template: "define {method} endpoint at {path}"
  0xC1:
    template: "respond with status {status}"
    with_param: "respond with status {status}: {body}"
  0xC2:
    template: "{method} request to {url}"
    with_param: "{method} request to {url} with body {body}"
  0xC3:
    template: "set header {name}: {value}"
  0xC4:
    template: "use middleware {name}"
    with_param: "use middleware {name} at {phase} phase"
  0xC5:
    template: "websocket at {path}"
    with_param: "websocket at {path} on {event}"
  0xC6:
    template: "require {scheme} auth"
    with_param: "require {scheme} auth with role {role}"
  0xC7:
    template: "rate limit: {max_requests} requests per {window}"
  0xC8:
    template: "allow CORS from {origin}"
    with_param: "allow CORS from {origin} methods {methods} headers {headers}"
  0xC9:
    template: "set cookie {name} to {value}"
    with_param: "set cookie {name} to {value} max-age {max_age}"
  0xCA:
    template: "{action} session"
    with_param: "{action} session key {key}"
  0xCB:
    template: "configure SSL cert {cert} key {key}"
    with_param: "configure SSL cert {cert} key {key} min TLS {min_version}"
  0xCC:
    template: "GraphQL endpoint at {path}"
    with_param: "GraphQL endpoint at {path} schema {schema}"
  0xCD:
    template: "SSE stream at {path}"
    with_param: "SSE stream at {path} event {event}"
  0xCE:
    template: "accept upload field {field}"
    with_param: "accept upload field {field} max {max_size}"
  0xCF:
    template: "redirect to {url}"
    with_param: "redirect to {url} with status {status}"

  # Data (0xD0-0xDF)
  0xD0:
    template: "query {source}"
    with_param: "query {source} where {filter}"
  0xD1:
    template: "transform: {operation}"
    with_param: "transform {field}: {operation}"
  0xD2:
    template: "validate against {schema}"
  0xD3:
    template: "map {function} over collection"
  0xD4:
    template: "filter where {predicate}"
  0xD5:
    template: "reduce: {operation}"
    with_param: "reduce {field}: {operation}"
  0xD6:
    template: "sort by {field}"
    with_param: "sort by {field} {order}"
  0xD7:
    template: "group by {field}"
  0xD8:
    template: "join {left} with {right}"
    with_param: "join {left} with {right} on {on}"
  0xD9:
    template: "distinct"
    with_param: "distinct on {field}"
  0xDA:
    template: "merge {source} into {target}"
    with_param: "merge {source} into {target} ({strategy})"
  0xDB:
    template: "schema {name}"
    with_param: "schema {name} ({fields})"
  0xDC:
    template: "index {field}"
  0xDD:
    template: "batch {size}"
  0xDE:
    template: "stream {source}"
    with_param: "stream {source} via {handler}"
  0xDF:
    template: "cache {key}"
    with_param: "cache {key} (ttl: {ttl})"

  # Logic (0xE0-0xED)
  0xE0:
    template: "when {condition}:"
  0xE1:
    template: "match {value}:"
  0xE2:
    template: "repeat {count} times:"
    with_param: "repeat while {condition}:"
  0xE3:
    template: "try:"
    with_param: "try (catch in {error_var}):"
  0xE4:
    template: "otherwise:"
    with_param: "otherwise, if {condition}:"
  0xE5:
    template: "stop repeating"
  0xE6:
    template: "skip to next"
  0xE7:
    template: "if {error_type} error occurs:"
    with_param: "if {error_type} error occurs (as {target}):"
  0xE8:
    template: "always do:"
  0xE9:
    template: "signal error: {error_type}"
    with_param: "signal error: {error_type} — {message}"
  0xEA:
    template: "switch on {value}:"
  0xEB:
    template: "for each {element_var} in {collection}:"
  0xEC:
    template: "while {condition}:"
  0xED:
    template: "assert {variable} is {expected_type}"
    with_param: "assert {variable} is {expected_type}: \"{message}\""

# Emotional Vector Region Mappings
# Maps emotional vector ranges to human-readable labels.
# Use with the Emotional Vector encoding (SPEC.md Section 9).
emotional_regions:
  joy:
    valence: [64, 127]
    arousal: [0, 80]
    dominance: [20, 100]
    description: "Content, happy, satisfied"
  excitement:
    valence: [60, 127]
    arousal: [80, 127]
    dominance: [40, 127]
    description: "Thrilled, energized, exhilarated"
  anger:
    valence: [-127, -40]
    arousal: [60, 127]
    dominance: [40, 127]
    description: "Frustrated, angry, furious"
  fear:
    valence: [-127, -20]
    arousal: [60, 127]
    dominance: [-127, -20]
    description: "Anxious, scared, panicked"
  sadness:
    valence: [-127, -30]
    arousal: [-127, -20]
    dominance: [-127, 0]
    description: "Down, sorrowful, grief"
  calm:
    valence: [-10, 40]
    arousal: [-127, -40]
    dominance: [-20, 40]
    description: "Relaxed, peaceful, serene"
  surprise:
    valence: [-20, 80]
    arousal: [80, 127]
    dominance: [-40, 40]
    description: "Startled, amazed, astonished"
  disgust:
    valence: [-127, -50]
    arousal: [0, 60]
    dominance: [20, 80]
    description: "Repulsed, revolted, contemptuous"
  trust:
    valence: [30, 100]
    arousal: [-40, 40]
    dominance: [0, 60]
    description: "Confident, secure, trusting"
  neutral:
    valence: [-15, 15]
    arousal: [-15, 15]
    dominance: [-15, 15]
    description: "No significant emotional context"
  urgency_low:
    urgency: [0, 50]
    description: "Routine, no time pressure"
  urgency_medium:
    urgency: [51, 150]
    description: "Moderate priority, timely attention needed"
  urgency_high:
    urgency: [151, 220]
    description: "High priority, prompt action required"
  urgency_critical:
    urgency: [221, 255]
    description: "Critical, immediate action required"

# Emotional region mappings (valence, arousal -> closest word)
emotional_coordinates:
  "+0.9,+0.9": "ecstatic"
  "+0.8,+0.7": "thrilled"
  "+0.7,+0.5": "excited"
  "+0.6,+0.3": "happy"
  "+0.4,+0.1": "pleased"
  "+0.3,-0.2": "content"
  "+0.2,-0.5": "serene"
  "+0.1,-0.7": "peaceful"
  "0.0,0.0": "neutral"
  "-0.2,-0.3": "melancholic"
  "-0.3,-0.1": "disappointed"
  "-0.4,+0.2": "frustrated"
  "-0.5,+0.4": "irritated"
  "-0.6,+0.6": "angry"
  "-0.8,+0.8": "furious"
  "-0.9,+0.9": "enraged"
  "-0.3,+0.7": "anxious"
  "-0.5,+0.8": "panicked"
  "-0.6,-0.4": "sad"
  "-0.8,-0.6": "despairing"
  "-0.1,+0.9": "startled"
  "+0.1,+0.8": "amazed"

intent_mappings:
  request: "could you {action}?"
  inform: "{content}"
  question: "{content}?"
  command: "{action}!"
  empathize: "I understand, {content}"
  greet: "hello"
  farewell: "goodbye"
  agree: "yes, {content}"
  disagree: "no, {content}"
  apologize: "sorry, {content}"
