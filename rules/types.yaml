# Clanker-Lang Type System
# Defines all valid parameter types for opcode definitions.

types:
  str:
    code: 0x0
    description: "UTF-8 string, up to 15 bytes in compact form"
    encoding: "type nibble 0x0, length nibble (byte count), then raw UTF-8 bytes"
    examples: ["hello", "/api/v1", "application/json"]

  str_ext:
    code: 0x1
    description: "Extended UTF-8 string, up to 65535 bytes"
    encoding: "type nibble 0x1, followed by u16 length, then raw UTF-8 bytes"
    examples: ["a very long string that exceeds 15 bytes..."]

  int:
    code: 0x2
    description: "Signed integer, big-endian, 1-8 bytes"
    encoding: "type nibble 0x2, length nibble (byte count), then big-endian signed integer"
    range: "-2^63 to 2^63-1"
    examples: [0, 42, -1, 200, 65535]

  float:
    code: 0x3
    description: "IEEE 754 floating point number"
    encoding: "type nibble 0x3, length nibble (4 or 8), then IEEE 754 float/double"
    examples: [3.14, 0.5, -273.15]

  bool:
    code: 0x4
    description: "Boolean value"
    encoding: "type nibble 0x4, value nibble (0 = false, 1 = true)"
    examples: [true, false]

  duration:
    code: 0x5
    description: "Duration in milliseconds, stored as u32"
    encoding: "type nibble 0x5, always 4 bytes, unsigned 32-bit integer (milliseconds)"
    text_format: "Human-readable suffixes: ms, s, m, h (e.g., '500ms', '5s', '2m', '1h')"
    max: "~49.7 days"
    examples: ["100ms", "5s", "2m", "1h"]

  bytes:
    code: 0x6
    description: "Raw byte array"
    encoding: "type nibble 0x6, followed by u16 length, then raw bytes"
    text_format: "Hex-encoded string prefixed with 0x (e.g., '0xDEADBEEF')"
    examples: ["0xFF", "0xDEADBEEF"]

  list:
    code: 0x7
    description: "Ordered list of type-tagged values"
    encoding: "type nibble 0x7, item count nibble, then each item is a type-tagged value"
    max_items: 15
    examples: ["[1, 2, 3]", "[\"a\", \"b\"]"]

  varref:
    code: 0x8
    description: "Reference to a variable slot ($0-$31)"
    encoding: "type nibble 0x8, value nibble is the slot number (0-31)"
    text_format: "$N where N is 0-31, or $_ for unused"
    examples: ["$0", "$1", "$31", "$_"]

  map:
    code: 0x9
    description: "Key-value map, keys are always strings"
    encoding: "type nibble 0x9, pair count nibble, then alternating key(str)-value(tagged) pairs"
    max_pairs: 15
    examples: ["{\"key\": \"value\", \"count\": 42}"]

# Reserved type codes 0xA through 0xF for future use.
reserved: [0xA, 0xB, 0xC, 0xD, 0xE, 0xF]

# Type coercion rules
coercion:
  - from: int
    to: float
    rule: "Implicit widening: int values can be used where float is expected"
  - from: str
    to: str_ext
    rule: "Automatic promotion: strings longer than 15 bytes are encoded as str_ext"
  - from: bool
    to: int
    rule: "true = 1, false = 0 when used in integer context"

# Null/absent
null_handling: >
  Clank has no null type. Optional parameters are simply absent.
  A varref to an unset slot ($N where N has not been assigned) is an error.
