[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phin-lang"
version = "0.1.0"
description = "Reference decoder for Phin-Lang, a universal bytecode IR for AI communication"
readme = "../../README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "deucebucket"}
]
keywords = ["phin", "bytecode", "ai", "language", "decoder", "intermediate-representation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/deucebucket/phin-lang"
Repository = "https://github.com/deucebucket/phin-lang"
Issues = "https://github.com/deucebucket/phin-lang/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
