name: qualified state components

on:
  pull_request:
    paths:
      - 'clanker_lm/state_scope.py'
      - 'clanker_lm/state_descriptions.py'
      - 'tests/test_state_description_core.py'
      - '.github/workflows/state-components.yml'
  push:
    branches:
      - 'feature/clanker-lm-qualified-state-components'

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - run: python -m compileall -q clanker_lm
      - run: python -m pytest tests/test_state_description_core.py tests/test_scoped_state_evidence.py engine/tests -q
