name: Export generated relative-clause source

on:
  push:
    branches:
      - feature/clanker-lm-relative-clauses
    paths:
      - .relative-current/READY_DEBUG

permissions:
  contents: write

concurrency:
  group: relative-clause-debug-export
  cancel-in-progress: false

jobs:
  export-generated-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/clanker-lm-relative-debug
          fetch-depth: 0

      - name: Materialize generated source on clean main-based branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            feature/clanker-lm-relative-clauses \
            feature/clanker-lm-relative-modifiers \
            main
          git reset --hard origin/main
          git clean -fdx
          git archive origin/feature/clanker-lm-relative-clauses .relative-current | tar -x
          git show origin/feature/clanker-lm-relative-modifiers:.relative-modifier-materialize/apply.py > /tmp/relative-apply.py
          python .relative-current/currentize6.py
          git diff --check

      - name: Commit complete inspectable generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clanker_lm docs tests
          git diff --cached --check
          git commit -m "debug: materialize complete relative-clause implementation"
          git push --force origin HEAD:feature/clanker-lm-relative-debug
