name: task-gated memory activation

on:
  push:
    branches: ['feature/clanker-lm-memory-activation-core']
  pull_request:
    paths:
      - 'clanker_lm/activation.py'
      - 'tests/test_activation_core.py'
      - '.github/workflows/memory-activation.yml'
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test requirements
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e ".[test,web]"
      - run: python -m compileall -q clanker_lm/activation.py
      - name: Exercise activation policy, receipt replay and unchanged engine
        run: python -m pytest tests/test_activation_core.py engine/tests -q
