name: tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[test,web]"

      - name: Compile source
        run: python -m compileall -q engine clanker_lm evaluation tests

      - name: Verify frozen conversation corpus
        run: python -m evaluation.conversations verify

      - name: Enforce additive-only held-out versions
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            additive_base="${{ github.event.before }}"
            git fetch --no-tags --depth=1 origin "$additive_base"
          else
            additive_base="origin/main"
            git fetch --no-tags --depth=1 origin main
          fi
          python -m evaluation.conversations verify-additive --base "$additive_base"

      - name: Run open development conversation evaluation
        run: python -m evaluation.conversations run --split development --output /tmp/clanker-conversation-dev.json

      - name: Install Chromium for web DOM acceptance
        if: matrix.python-version == '3.12'
        run: python -m playwright install --with-deps chromium

      - name: Run full regression suite
        run: python -m pytest -q

      - name: Verify web milestones are merged at their recorded commits
        if: matrix.python-version == '3.12'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m clanker_lm.web_release_verify

      - name: Run deterministic Clanker-LM acceptance harness
        run: python benchmarks/clanker_lm_eval.py
