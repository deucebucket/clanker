name: Validate private memory boundary source
on:
  push:
    branches: [build/clanker-private-memory]
    paths: [.scope-stage/part4]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/clanker-private-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and materialize only new reviewed files
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json
          from pathlib import Path
          raw=base64.b64decode(''.join(Path('.scope-stage/part'+str(i)).read_text() for i in range(5)),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='b2d055f3e0fa891227da6c847688e1eb1dfceab3dd6c803be36e154986124be1'
          files=json.loads(gzip.decompress(raw))
          allowed={'experiments/private_memory/__init__.py','experiments/private_memory/README.md','tests/test_private_memory.py','docs/CLANKER_LM_PRIVATE_SCOPE_DEVLOG.md'}
          assert set(files)==allowed
          for name,text in files.items():
              p=Path(name)
              assert not p.exists()
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(text,encoding='utf-8')
          PY
          git diff --check
      - name: Execute native runtime scope tests
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pytest tests/test_private_memory.py -q
      - name: Commit tested files only on staging branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/private_memory tests/test_private_memory.py docs/CLANKER_LM_PRIVATE_SCOPE_DEVLOG.md
          git diff --cached --check
          git commit -m 'feat: stage verified principal-scoped memory service'
          git push origin HEAD:build/clanker-private-memory
