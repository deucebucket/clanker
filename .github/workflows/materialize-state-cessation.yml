name: Validate state cessation source
on:
  push:
    branches: [build/clanker-state-cessation]
    paths: [.cessation-stage/READY]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/clanker-state-cessation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply exact source patch
        run: |
          set -euo pipefail
          cat .cessation-stage/part* | base64 --decode | gzip --decompress > /tmp/native.patch
          echo '40965ac1a8101306c4bd63969a38c6d1749eb4902ec68f1e3151a21ada383605  /tmp/native.patch' | sha256sum --check --strict
          git apply --check --exclude=clanker_lm/parser.py /tmp/native.patch
          git apply --exclude=clanker_lm/parser.py /tmp/native.patch
          python .cessation-stage/adapt_parser.py
          git diff --check
      - name: Run native semantic and engine regressions
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m compileall -q clanker_lm
          python -m pytest tests/test_cessation_semantics.py tests/test_state_description_core.py tests/test_scoped_state_evidence.py engine/tests -q
      - name: Commit tested native source on staging branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clanker_lm/cessation.py clanker_lm/state_scope.py clanker_lm/parser.py clanker_lm/response_policy.py clanker_lm/state_descriptions.py tests/test_cessation_semantics.py
          git diff --cached --check
          git commit -m 'fix: stage validated cessation and current-state evidence semantics'
          git push origin HEAD:build/clanker-state-cessation
