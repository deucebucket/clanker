name: Export dialogue repair source
on:
  push:
    branches: [feature/clanker-lm-dialogue-learning-repairs]
    paths: [.github/workflows/export-dialogue-repair-source.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export exact experimental base
        run: |
          git branch repair-base c58ed145f08c41b230d88b958ebb0110c692a16c
          git bundle create /tmp/dialogue-repair-source.bundle repair-base
      - uses: actions/upload-artifact@v4
        with:
          name: dialogue-repair-source
          path: /tmp/dialogue-repair-source.bundle
          retention-days: 1
