name: Validate native modular decomposition
on:
  push:
    branches: [build/clanker-modular-foundation]
    paths: ['.modularity-stage/**']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/clanker-modular-foundation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source payload and exact original modules
        run: |
          set -euo pipefail
          cat .modularity-stage/part* | base64 --decode > /tmp/modularity.xz
          echo '7c389b63d8f84eb62b498c38d05afb6dcd9bd8066fd52a957a81ff991aba894a  /tmp/modularity.xz' | sha256sum --check --strict
          python - <<'PY'
          import json, lzma, pathlib, subprocess, sys
          root = pathlib.Path.cwd()
          data = json.loads(lzma.decompress(pathlib.Path('/tmp/modularity.xz').read_bytes()))
          assert set(data) == {'schema', 'baseline', 'files', 'generators'} and data['schema'] == 1
          assert set(data['baseline']) == {'clanker_lm/model.py', 'clanker_lm/parser.py', 'clanker_lm/qa.py', 'clanker_lm/realize.py'}
          for name, expected in data['baseline'].items():
              actual = subprocess.check_output(['git', 'hash-object', name], text=True).strip()
              assert actual == expected, (name, actual, expected)
          assert set(data['generators']) == {'model_parser.py', 'answers.py'}
          for name in ('model_parser.py', 'answers.py'):
              path = pathlib.Path('/tmp') / name
              path.write_text(data['generators'][name], encoding='utf-8')
              subprocess.run([sys.executable, str(path), str(root)], check=True)
          for name, text in data['files'].items():
              path = root / name
              assert path.resolve().is_relative_to(root) and not path.exists(), name
              assert name.startswith(('tools/architecture/', 'tests/test_modular_', 'docs/CLANKER_LM_MODULARITY', '.github/workflows/modularity')) or name == 'architecture_policy.json', name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')
          ignore = root / '.gitignore'
          text = ignore.read_text(encoding='utf-8')
          assert text.splitlines().count('tools/') == 1
          ignore.write_text(text.replace('\ntools/\n', '\ntools/*\n!tools/architecture/\n'), encoding='utf-8')
          note = '\n\n## 2026-09-12 — modular semantic/parser/answer/realizer boundaries (#161)\n\nDecompose existing native source into explicit responsibility modules with public compatibility facades. Ordered parsing stages retain a per-call typed context; architecture checks reject new monoliths, cycles and dependency inversions and ratchet remaining named legacy debt. No engine or sealed evaluation changes. This entry records source restructuring, not new reasoning capability or completed default integration. See docs/CLANKER_LM_MODULARITY.md for measured scope and limitations.\n'
          for name in ('CHANGELOG.md', 'docs/DEVLOG.md', 'docs/CLANKER_LM_CHANGELOG.md', 'docs/CLANKER_LM_DEVLOG.md'):
              path = root / name
              if path.exists():
                  path.write_text(path.read_text(encoding='utf-8') + note, encoding='utf-8')
          PY
          git diff --check
      - name: Install package and run real regressions
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e ".[test,web]"
          python -m compileall -q clanker_lm tools/architecture
          python -m tools.architecture --output /tmp/native-architecture.json
          python -m pytest tests/test_modular_architecture.py tests/test_parser.py tests/test_qa_runtime.py tests/test_content_complements.py tests/test_gerund_complements.py tests/test_infinitival_complements.py tests/test_embedded_interrogatives.py engine/tests -q
      - name: Commit validated source on staging branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore architecture_policy.json .github/workflows/modularity.yml clanker_lm/model.py clanker_lm/parser.py clanker_lm/qa.py clanker_lm/realize.py clanker_lm/semantic_types clanker_lm/parsing clanker_lm/answering clanker_lm/realization tools/architecture tests/test_modular_architecture.py docs/CLANKER_LM_MODULARITY.md CHANGELOG.md docs/DEVLOG.md docs/CLANKER_LM_CHANGELOG.md docs/CLANKER_LM_DEVLOG.md
          git diff --cached --check
          git commit -m 'refactor: stage verified native modular decomposition and architecture checks'
          git push origin HEAD:build/clanker-modular-foundation
