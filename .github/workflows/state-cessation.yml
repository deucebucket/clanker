name: state cessation semantics

on:
  pull_request:
    paths:
      - 'clanker_lm/cessation.py'
      - 'clanker_lm/state_scope.py'
      - 'clanker_lm/state_descriptions.py'
      - 'clanker_lm/parser.py'
      - 'clanker_lm/response_policy.py'
      - 'tests/test_cessation_semantics.py'
      - '.github/workflows/state-cessation.yml'
  push:
    branches:
      - 'fix/clanker-lm-state-cessation'

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and native test requirements
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - run: python -m compileall -q clanker_lm
      - name: Verify scope, revision and existing engine behavior
        run: python -m pytest tests/test_cessation_semantics.py tests/test_state_description_core.py tests/test_scoped_state_evidence.py engine/tests -q
