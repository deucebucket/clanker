name: Apply Clanker-LM semantic audit fix

on:
  push:
    branches:
      - feature/clanker-lm-deterministic-qa
    paths:
      - .clanker-lm-audit/READY

permissions:
  contents: write

concurrency:
  group: clanker-lm-semantic-audit
  cancel-in-progress: false

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/clanker-lm-deterministic-qa
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify and apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          echo "0adbe5965fbf9885201b0a03c0620ea9155771aeb85757f57587617ec24b9bd1  .clanker-lm-audit/semantic-audit.patch" | sha256sum --check --strict
          git apply --check .clanker-lm-audit/semantic-audit.patch
          git apply .clanker-lm-audit/semantic-audit.patch
      - name: Run complete validation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m compileall -q clanker_lm
          python -m pytest engine/tests/ -q
          python -m clanker_lm --once "Sarah did not buy a Honda. What did Sarah buy?" --strict-clanker --trace
      - name: Commit source and regression tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            clanker_lm/memory.py \
            clanker_lm/answers.py \
            clanker_lm/parser.py \
            engine/tests/test_clanker_lm_runtime.py \
            engine/tests/test_clanker_lm_parser.py
          git commit -m "fix: preserve polarity tense and justification semantics"
          git push origin HEAD:feature/clanker-lm-deterministic-qa
