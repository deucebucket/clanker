name: state continuation semantics
on:
  pull_request:
    paths:
      - 'clanker_lm/continuation.py'
      - 'clanker_lm/state_vocabulary.py'
      - 'clanker_lm/parser.py'
      - 'clanker_lm/state_scope.py'
      - 'clanker_lm/state_descriptions.py'
      - 'clanker_lm/recurrence.py'
      - 'tests/test_continuation_semantics.py'
      - '.github/workflows/state-continuation.yml'
  push:
    branches: ['fix/clanker-lm-state-continuation']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test requirements
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - run: python -m compileall -q clanker_lm
      - name: Verify scoped operators and existing engine behavior
        run: python -m pytest tests/test_continuation_semantics.py tests/test_recurrence_semantics.py tests/test_state_description_core.py tests/test_cessation_semantics.py tests/test_scoped_state_evidence.py engine/tests -q
