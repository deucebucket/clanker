name: Clanker-LM CI

on:
  pull_request:
    paths:
      - "clanker_lm/**"
      - "engine/**"
      - "examples/clanker_lm_demo.py"
      - "docs/CLANKER_LM.md"
      - "requirements.txt"
      - ".github/workflows/clanker-lm-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependency
        run: python -m pip install -r requirements.txt
      - name: Compile Clanker-LM
        run: python -m compileall -q clanker_lm
      - name: Run complete engine test suite
        run: python -m pytest engine/tests/ -q
      - name: Run deterministic CLI smoke test
        run: python -m clanker_lm --once "My sister pissed me off again." --strict-clanker --trace
