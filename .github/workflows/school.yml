name: school foundations

on:
  pull_request:
    paths:
      - 'experiments/school/**'
      - 'tests/test_school*'
      - '.github/workflows/school.yml'
  push:
    branches:
      - 'feature/clanker-lm-school-foundations'

permissions:
  contents: read

jobs:
  school:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_school_curriculum.py tests/test_school_temporal_repair.py -q
      - run: python -m experiments.school --phase both --output /tmp/school-baseline.json
      - run: python -m experiments.school --phase both --candidate temporal-suffix-v1 --output /tmp/school-candidate.json
      - name: Check paired population and targeted improvement
        run: |
          python - <<'PY'
          import json
          a = json.load(open('/tmp/school-baseline.json'))
          b = json.load(open('/tmp/school-candidate.json'))
          assert a['student']['source_sha256'] == b['student']['source_sha256']
          assert a['student']['curriculum_sha256'] == b['student']['curriculum_sha256']
          assert [e['context'] for e in a['episodes']] == [e['context'] for e in b['episodes']]
          assert b['passed_checks'] >= a['passed_checks']
          for skill in ('time_attachment', 'borrow_roles'):
              rows = [e for e in b['episodes'] if e['skill'] == skill]
              assert rows and all(e['passed'] for e in rows), skill
          assert b['curriculum']['academic_transfer']['state'] == 'blocked'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: school-evidence-py${{ matrix.python-version }}
          path: /tmp/school-*.json
