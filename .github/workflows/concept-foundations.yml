name: concept foundation semantics

on:
  pull_request:
    paths:
      - 'clanker_lm/concept_learning/**'
      - 'tests/test_concept_core.py'
      - '.github/workflows/concept-foundations.yml'
  push:
    branches:
      - 'feature/clanker-lm-concept-foundation-core'

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - run: python -m compileall -q clanker_lm/concept_learning
      - run: python -m pytest tests/test_concept_core.py engine/tests -q
