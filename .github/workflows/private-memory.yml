name: private memory compartments

on:
  pull_request:
    paths:
      - 'experiments/private_memory/**'
      - 'tests/test_private_memory.py'
      - '.github/workflows/private-memory.yml'
  push:
    branches:
      - 'feature/clanker-lm-private-memory'

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[test,web]"
      - run: python -m compileall -q experiments/private_memory
      - name: Test private compartments and existing engine
        run: python -m pytest tests/test_private_memory.py engine/tests -q
