# Web opcodes: 0xC0-0xCF
# HTTP, API, and networking operations

opcodes:
  0xC0:
    name: ENDPOINT
    description: "Define an HTTP endpoint with a method and path."
    params:
      - {name: method, type: str, required: true}
      - {name: path, type: str, required: true}

  0xC1:
    name: RESPOND
    description: "Send an HTTP response with status and optional body."
    params:
      - {name: status, type: int, required: true}
      - {name: body, type: str, optional: true}
      - {name: content_type, type: str, optional: true}

  0xC2:
    name: REQUEST
    description: "Make an outbound HTTP request."
    params:
      - {name: method, type: str, required: true}
      - {name: url, type: str, required: true}
      - {name: body, type: str, optional: true}
      - {name: headers, type: map, optional: true}

  0xC3:
    name: HEADER
    description: "Set or read an HTTP header."
    params:
      - {name: name, type: str, required: true}
      - {name: value, type: str, optional: true}

  0xC4:
    name: MIDDLEWARE
    description: "Register middleware for request processing."
    params:
      - {name: name, type: str, required: true}
      - {name: phase, type: str, optional: true}

  0xC5:
    name: WEBSOCKET
    description: "Open or handle a WebSocket connection."
    params:
      - {name: path, type: str, required: true}
      - {name: event, type: str, optional: true}

  0xC6:
    name: AUTH
    description: "Apply authentication/authorization to the current scope."
    params:
      - {name: scheme, type: str, required: true}
      - {name: role, type: str, optional: true}

  0xC7:
    name: RATE_LIMIT
    description: "Apply rate limiting to the current endpoint."
    params:
      - {name: max_requests, type: int, required: true}
      - {name: window, type: duration, required: true}
