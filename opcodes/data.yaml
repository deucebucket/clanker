# Data opcodes: 0xD0-0xDF
# Data transformation, querying, and storage operations

opcodes:
  0xD0:
    name: QUERY
    description: "Execute a query against a data source."
    params:
      - {name: source, type: str, required: true}
      - {name: filter, type: str, optional: true}
      - {name: fields, type: list, optional: true}

  0xD1:
    name: TRANSFORM
    description: "Apply a transformation to data."
    params:
      - {name: operation, type: str, required: true}
      - {name: field, type: str, optional: true}

  0xD2:
    name: VALIDATE
    description: "Validate data against a schema or constraint."
    params:
      - {name: schema, type: str, required: true}
      - {name: data, type: varref, optional: true}

  0xD3:
    name: MAP
    description: "Apply a function to each element of a collection."
    params:
      - {name: function, type: str, required: true}
      - {name: collection, type: varref, optional: true}

  0xD4:
    name: FILTER
    description: "Filter a collection by a predicate."
    params:
      - {name: predicate, type: str, required: true}
      - {name: collection, type: varref, optional: true}

  0xD5:
    name: REDUCE
    description: "Aggregate a collection using an operation (sum, count, avg, min, max)."
    params:
      - {name: operation, type: str, required: true}
      - {name: field, type: str, optional: true}
      - {name: collection, type: varref, optional: true}

  0xD6:
    name: SORT
    description: "Sort a collection by a field in a given order."
    params:
      - {name: field, type: str, required: true}
      - {name: order, type: str, optional: true}

  0xD7:
    name: GROUP_BY
    description: "Group a collection by a field."
    params:
      - {name: field, type: str, required: true}
      - {name: collection, type: varref, optional: true}

  0xD8:
    name: JOIN
    description: "Combine two datasets on a matching key."
    params:
      - {name: left, type: varref, required: true}
      - {name: right, type: varref, required: true}
      - {name: on, type: str, optional: true}

  0xD9:
    name: DISTINCT
    description: "Remove duplicate entries from a collection."
    params:
      - {name: field, type: str, optional: true}
      - {name: collection, type: varref, optional: true}

  0xDA:
    name: MERGE
    description: "Merge or upsert one dataset into another."
    params:
      - {name: source, type: varref, required: true}
      - {name: target, type: varref, required: true}
      - {name: strategy, type: str, optional: true}

  0xDB:
    name: SCHEMA
    description: "Define or enforce a data shape."
    params:
      - {name: name, type: str, required: true}
      - {name: fields, type: list, optional: true}

  0xDC:
    name: INDEX
    description: "Create an index on a field for fast lookup."
    params:
      - {name: field, type: str, required: true}
      - {name: collection, type: varref, optional: true}

  0xDD:
    name: BATCH
    description: "Process items in batches of a given size."
    params:
      - {name: size, type: int, required: true}
      - {name: collection, type: varref, optional: true}

  0xDE:
    name: STREAM
    description: "Process items from a source one at a time."
    params:
      - {name: source, type: str, required: true}
      - {name: handler, type: str, optional: true}

  0xDF:
    name: CACHE
    description: "Cache the result of a query or computation."
    params:
      - {name: key, type: str, required: true}
      - {name: ttl, type: duration, optional: true}
