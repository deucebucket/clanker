# Social and Emotional opcodes for Clanker
# These enable emotional encoding as a built-in feature of the language

opcodes:
  0x06:
    name: SOCIAL
    description: "Social interaction and emotional encoding"
    subtypes:
      emotion:
        description: "Emotional state as vector coordinates"
        params:
          - {name: valence, type: float, range: "-1.0:1.0", description: "Negative to positive"}
          - {name: arousal, type: float, range: "-1.0:1.0", description: "Calm to intense"}
          - {name: dominance, type: float, range: "-1.0:1.0", optional: true, description: "Submissive to dominant"}
          - {name: urgency, type: float, range: "0.0:1.0", optional: true, description: "How time-sensitive"}
          - {name: context, type: string, optional: true, description: "Situational context"}
      intent:
        description: "Communicative intent classification"
        params:
          - {name: type, type: enum, values: [request, inform, question, command, empathize, greet, farewell, agree, disagree, apologize]}
          - {name: urgency, type: float, range: "0.0:1.0", optional: true}
      sentiment:
        description: "Overall sentiment marker for a block of Clanker"
        params:
          - {name: polarity, type: float, range: "-1.0:1.0"}
          - {name: confidence, type: float, range: "0.0:1.0"}
